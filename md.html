<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wachira90.github.io markdown</title>

<body>
<div id="content"></div>

  **Bold Text**

  document.getElementById('content').innerHTML = marked.parse(md);
