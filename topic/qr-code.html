<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Quick Generator</title>
  <link rel="stylesheet" href="quick-commands.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background: #f5f5f5;
    }
    h2 {
      margin-bottom: 1.5rem;
    }
    .input-wrapper {
      width: 100%;
      max-width: 400px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      font-size: 14px;
      font-family: monospace;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #888;
    }
    .char-count {
      font-size: 12px;
      color: #999;
      text-align: right;
      margin-top: 4px;
    }
    #qrcode {
      margin-top: 1.5rem;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.quick-page { align-items: flex-start; color: var(--text); background: radial-gradient(1200px 600px at 10% 0%, #182a4f 0%, var(--bg) 50%) no-repeat; }
    .qr-shell { width: min(560px, 100%); }
    .qr-card { padding: 22px; border: 1px solid var(--border); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
    .qr-card h1 { margin-top: 0; color: var(--text); font-size: 22px; }
    .qr-card label { color: var(--muted); }
    .qr-card input[type="text"] { background: rgba(0,0,0,.22); color: var(--text); border-color: var(--border); }
    .qr-card .char-count { color: var(--muted); }
    #qrcode { padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: rgba(0,0,0,.25); }
  </style>
</head>
<body class="quick-page">
<main class="qr-shell">
  <nav class="quick-nav"><a href="../index.html">กลับไปยังหน้าหลัก</a><span class="quick-kicker">QR Code Utility</span></nav>
  <section class="qr-card">
  <h1>QR Code Generator</h1>
  <p style="color:var(--muted);font-size:13px;line-height:1.5">สร้าง QR Code สำหรับ URL หรือข้อความสั้น ๆ โดยประมวลผลภายในเบราว์เซอร์</p>

  <div class="input-wrapper">
    <label for="qr-input">ข้อความหรือ URL</label>
    <input
      type="text"
      id="qr-input"
      placeholder="พิมพ์ข้อความ"
      value="https://google.co.th"
    />
    <div class="char-count">
      <span id="char-count">21</span> / 48
    </div>
  </div>

  <div id="qrcode"></div>

  </section>
</main>

  <script>
    var input = document.getElementById('qr-input');
    var charCount = document.getElementById('char-count');
    var container = document.getElementById('qrcode');

    var qr = new QRCode(container, {
      text: input.value,
      width: 200,
      height: 200,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    input.addEventListener('keyup', function () {
      var val = this.value.trim();
      charCount.textContent = this.value.length;
      container.innerHTML = '';
      if (val.length === 0) return;
      new QRCode(container, {
        text: val,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    });
  </script>

</body>
</html>
