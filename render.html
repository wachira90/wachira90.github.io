<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Markdown Renderer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/uikit/2.27.5/js/uikit.min.css">
    
  </head>
  <body>
    <div
      class="uk-container uk-container-center uk-margin-top uk-margin-large-bottom"
    >
      <div id="content">Loading content...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uikit/2.27.5/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
      <script>
        // 2. Fetch the .md file
        fetch("md.md")
          .then((response) => response.text())
          .then((text) => {
            // 3. Convert Markdown to HTML and inject into the page
            document.getElementById("content").innerHTML = marked.parse(text);
          });
      </script>
    </div>
  </body>
</html>
